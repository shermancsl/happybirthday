<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Egg 🥚</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <p class="instruction">
            Click the egg
        </p>

        <!-- Egg -->
        <div id="egg-container" class="egg-container">

            <div id="egg" class="egg">

                <!-- Crack lines -->
                <div class="crack crack1"></div>
                <div class="crack crack2"></div>
                <div class="crack crack3"></div>

            </div>

            <!-- Chick -->
            <div id="chick" class="chick">
                🐣
            </div>

        </div>

        <!-- Click counter -->
        <div id="counter" class="counter">
            0 
        </div>

        <div id="message" class="message">
            Click the egg!
        </div>

        <!-- Birthday result -->
        <div id="birthday" class="birthday">

            <div class="confetti">🎉 🎊 🎈 🎊 🎉</div>

            <h2>HAPPY BIRTHDAY!</h2>

            <p>
                🎂 Wishing you a wonderful birthday! 🎂
            </p>

            <p class="small-message">
                Hope your day is filled with happiness,<br>
                laughter and lots of cake! 💕
            </p>

            <button id="restart">
                🥚 Play Again
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
